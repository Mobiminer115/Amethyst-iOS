name: Development build

on:
  pull_request:
    branches-ignore:
      - 'l10n_main'
    types: [opened, reopened]
  push:
    branches-ignore:
      - 'l10n_main'
  workflow_dispatch:

jobs:
  build:
    name: Development build
    strategy:
      matrix:
        include:
          - platform: 2
            platform_name: ios
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install JDK 8 and native build tools
        shell: bash
        run: |
          set -euo pipefail
          export HOMEBREW_NO_AUTO_UPDATE=1
          brew install --cask temurin@8
          brew install ldid wget
          JDK_HOME="$(/usr/libexec/java_home -v 1.8)"
          test -x "$JDK_HOME/bin/javac"
          echo "JAVA_HOME=$JDK_HOME" >> "$GITHUB_ENV"
          echo "JAVA_HOME=$JDK_HOME"
          "$JDK_HOME/bin/javac" -version

      - name: Build GL4ES 1.1.6 legacy renderer
        shell: bash
        run: |
          set -euo pipefail
          rm -rf gl4es
          git clone --depth 1 --branch v1.1.6 https://github.com/ptitSeb/gl4es.git gl4es
          cd gl4es
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/gl/directstate.c')
          s = p.read_text()
          replacements = {
              'AliasDecl(void,gl4es_glEnableClientStatei,(GLenum array, GLuint index),gl4es_glEnableClientStateIndexed);':
              'void APIENTRY_GL4ES gl4es_glEnableClientStatei(GLenum array, GLuint index) { gl4es_glEnableClientStateIndexed(array, index); }',
              'AliasDecl(void,gl4es_glDisableClientStatei,(GLenum array, GLuint index),gl4es_glDisableClientStateIndexed);':
              'void APIENTRY_GL4ES gl4es_glDisableClientStatei(GLenum array, GLuint index) { gl4es_glDisableClientStateIndexed(array, index); }',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'missing expected GL4ES source line: {old}')
              s = s.replace(old, new)
          p.write_text(s)
          PY

          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/CMakeLists.txt')
          s = p.read_text()
          marker = 'else()\n    add_library(GL SHARED ${GL_SRC})\n'
          replacement = 'else()\n    add_library(GL SHARED ${GL_SRC})\n    if(CMAKE_SYSTEM_NAME MATCHES "iOS")\n        target_link_libraries(GL "-framework OpenGLES")\n    endif()\n'
          if marker not in s:
              raise SystemExit('GL shared-library target marker not found')
          s = s.replace(marker, replacement, 1)
          p.write_text(s)
          PY

          curl -L --fail --retry 3 -o ios.toolchain.cmake https://github.com/leetal/ios-cmake/raw/master/ios.toolchain.cmake
          cmake -B build \
            -DCMAKE_TOOLCHAIN_FILE=ios.toolchain.cmake \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DDEFAULT_ES=2 \
            -DNOX11=ON \
            -DNOEGL=OFF \
            -DSTATICLIB=OFF \
            -DPLATFORM=OS64 \
            -DDEPLOYMENT_TARGET=13.0 \
            -DCMAKE_C_FLAGS='-Wno-error=implicit-function-declaration'
          cmake --build build --config RelWithDebInfo --target GL --verbose
          test -f lib/libGL.dylib
          cp -f lib/libGL.dylib ../Natives/resources/Frameworks/libgl4es_114.dylib
          cd ..

      - name: Verify staged GL4ES binary
        shell: bash
        run: |
          set -euo pipefail
          test -f Natives/resources/Frameworks/libgl4es_114.dylib
          file Natives/resources/Frameworks/libgl4es_114.dylib
          otool -L Natives/resources/Frameworks/libgl4es_114.dylib

      - name: Build for ${{ matrix.platform_name }}
        shell: bash
        run: |
          set -euo pipefail
          export SLIMMED=1
          export BOOTJDK="$JAVA_HOME/bin"
          make -j$(sysctl -n hw.ncpu) dsym package PLATFORM=${{ matrix.platform }} BOOTJDK="$BOOTJDK"
          make -j$(sysctl -n hw.ncpu) dsym package PLATFORM=${{ matrix.platform }} TROLLSTORE_JIT_ENT=1 BOOTJDK="$BOOTJDK"

      - name: Upload regular ipa
        uses: actions/upload-artifact@v4
        with:
          name: org.angelauramc.amethyst-${{ matrix.platform_name }}.ipa
          path: artifacts/org.angelauramc.amethyst-*-${{ matrix.platform_name }}.ipa
      - name: Upload regular tipa
        uses: actions/upload-artifact@v4
        with:
          name: org.angelauramc.amethyst-${{ matrix.platform_name }}-trollstore.tipa
          path: artifacts/org.angelauramc.amethyst-*-${{ matrix.platform_name }}.tipa
      - name: Upload slimmed ipa
        uses: actions/upload-artifact@v4
        with:
          name: org.angelauramc.amethyst.slimmed-${{ matrix.platform_name }}.ipa
          path: artifacts/org.angelauramc.amethyst.slimmed-*-${{ matrix.platform_name }}.ipa
      - name: Upload slimmed tipa
        uses: actions/upload-artifact@v4
        with:
          name: org.angelauramc.amethyst.slimmed-${{ matrix.platform_name }}-trollstore.tipa
          path: artifacts/org.angelauramc.amethyst.slimmed-*-${{ matrix.platform_name }}.tipa
      - name: Upload Amethyst dSYM
        uses: actions/upload-artifact@v4
        if: matrix.platform_name == 'ios'
        with:
          name: AngelAuraAmethyst.dSYM
          path: artifacts/AngelAuraAmethyst.dSYM